<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chapter Revision Helper</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7ee;--ink:#1d1b2e;--mut:#6a6780;--card:#fff;--line:#e6dfcf;--p:#3b3bd6;--hl:#ffd84d;--ok:#1b8a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14131f;--ink:#f1eefc;--mut:#a29fbd;--card:#1e1d2e;--line:#33324a;--p:#8c8cff}}
:root[data-theme="dark"]{--bg:#14131f;--ink:#f1eefc;--mut:#a29fbd;--card:#1e1d2e;--line:#33324a;--p:#8c8cff}
*{box-sizing:border-box}html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Nunito,system-ui,sans-serif}
.wrap{max-width:900px;margin:auto;padding:28px 18px 70px}
h1{font:800 clamp(32px,6vw,52px)/1.05 Fraunces,Georgia,serif;margin:0 0 8px}
h1 mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 4px}
.sub{color:var(--mut);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}
.step{font:700 13px Nunito;letter-spacing:.12em;text-transform:uppercase;color:var(--p);margin-bottom:8px}
.drop{display:block;border:2px dashed var(--p);border-radius:12px;padding:26px 14px;text-align:center;cursor:pointer;font-weight:700}
.drop:hover{background:#3b3bd60d}.drop input{display:none}
textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:90px;margin-top:10px}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.set label{font-weight:700;font-size:14px;display:block;margin-bottom:4px;color:var(--mut)}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
button.a{padding:14px 12px;border:2px solid var(--p);background:var(--card);color:var(--ink);border-radius:12px;font:700 16px Nunito;cursor:pointer;text-align:left}
button.a:hover,button.a.on{background:var(--p);color:#fff}button.a small{display:block;font-weight:400;opacity:.8}
button:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:10px;margin-top:12px}.row input{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.go{background:var(--p);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:700 16px Nunito;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 12px;font:600 14px Nunito;cursor:pointer}
#out{line-height:1.7}#out h1,#out h2,#out h3{font-family:Fraunces,serif;margin:20px 0 6px;line-height:1.2}#out h2{border-bottom:2px solid var(--hl);padding-bottom:3px}
#out ul,#out ol{padding-left:22px}#out hr{border:0;border-top:2px dashed var(--line);margin:22px 0}
#out blockquote{margin:12px 0;padding:8px 14px;background:#ffd84d33;border-left:4px solid var(--hl);border-radius:6px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
#msg{color:var(--mut);font-size:15px;margin-top:8px}#file{font-weight:600;color:var(--ok);margin-top:8px}
@media print{body>.wrap>*:not(#res){display:none}.card{border:0}.ghost{display:none}}
</style></head><body><div class="wrap">
<h1>Chapter <mark>Revision</mark> Helper</h1>
<p class="sub">Upload a chapter PDF. Get important notes, a practice paper, flashcards and more.</p>

<div class="card"><div class="step">Step 1 · Add your chapter</div>
<label class="drop"><input id="pdf" type="file" accept="application/pdf">Tap to choose a PDF</label>
<div id="file"></div>
<textarea id="txt" placeholder="Or paste the chapter text here (use this for scanned PDFs or photos of pages)"></textarea></div>

<div class="card"><div class="step">Step 2 · Settings</div><div class="set">
<div><label for="lvl">Class / level</label><select id="lvl"><option>Class 6-8</option><option>Class 9-10</option><option selected>Class 11-12</option><option>College</option></select></div>
<div><label for="lang">Language</label><select id="lang"><option>English</option><option>Hindi</option><option>Punjabi</option></select></div>
<div><label for="mk">Paper marks</label><select id="mk"><option>20</option><option selected>40</option><option>80</option></select></div></div></div>

<div class="card"><div class="step">Step 3 · What do you want?</div><div class="acts" id="acts"></div>
<div class="row"><input id="cu" placeholder="Or ask anything about this chapter..."><button class="go" id="cg">Ask</button></div>
<div id="msg"></div></div>

<div class="card" id="res" hidden><div class="bar"><b id="ttl"></b><span><button class="ghost" id="cp">Copy</button> <button class="ghost" id="dl">Download</button> <button class="ghost" id="pr">Print</button></span></div><div id="out"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
var T={notes:['Important Notes','Key terms, points, formulas and a quick-revision box','Write exam-focused important notes: headings, key terms with simple definitions, important points, any formulas, dates or diagrams to remember, and a final "Quick revision" box of 6 short lines.'],
paper:['Practice Question Paper','Full paper with marking scheme and answers','Create a practice question paper totalling {M} marks. Section A: MCQs (1 mark each). Section B: short answers (2-3 marks). Section C: long answers (5 marks). Show marks for each question and the total time. After a line with only "---" add an "Answer Key and Marking Scheme" for every question.'],
imp:['Likely Exam Questions','10 important questions with model answers','List the 10 most likely exam questions from this chapter, each with a short model answer a student can write in the exam.'],
fc:['Flashcards','Question and answer pairs for quick revision','Make 15 flashcards. Format each as: **Q:** question, then on the next line **A:** short answer. Keep answers under 25 words.'],
sum:['Simple Summary','One page in easy words','Summarise the chapter in simple words on one page, then give 5 "Do you remember?" questions at the end.'],
mcq:['Practice MCQs','15 multiple-choice questions with answers','Create 15 multiple-choice questions with 4 options each. Put the correct answers and one-line explanations in a section after a line with only "---".']};
var A=document.getElementById('acts'),text='',busy=false,last='',cur='';
Object.keys(T).forEach(function(k){var b=document.createElement('button');b.className='a';b.innerHTML=T[k][0]+'<small>'+T[k][1]+'</small>';b.onclick=function(){run(k)};A.appendChild(b)});
function $(i){return document.getElementById(i)}
function msg(s){$('msg').textContent=s||''}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(s){s=esc(s);var l=s.split('\n'),o='',ul=0,ol=0;function cl(){if(ul){o+='</ul>';ul=0}if(ol){o+='</ol>';ol=0}}
function inl(t){return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>')}
l.forEach(function(x){var m;if(m=x.match(/^(#{1,3})\s+(.*)/)){cl();o+='<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>'}
else if(m=x.match(/^\s*[-*•]\s+(.*)/)){if(ol){o+='</ol>';ol=0}if(!ul){o+='<ul>';ul=1}o+='<li>'+inl(m[1])+'</li>'}
else if(m=x.match(/^\s*\d+[.)]\s+(.*)/)){if(ul){o+='</ul>';ul=0}if(!ol){o+='<ol>';ol=1}o+='<li>'+inl(m[1])+'</li>'}
else if(/^\s*(---+|\*\*\*+)\s*$/.test(x)){cl();o+='<hr>'}
else if(m=x.match(/^&gt;\s?(.*)/)){cl();o+='<blockquote>'+inl(m[1])+'</blockquote>'}
else if(x.trim()===''){cl()}else{cl();o+='<p>'+inl(x)+'</p>'}});cl();return o}
$('pdf').onchange=async function(e){var f=e.target.files[0];if(!f)return;msg('Reading PDF...');
try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
var d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,s='';
for(var i=1;i<=d.numPages&&s.length<90000;i++){var p=await d.getPage(i),c=await p.getTextContent();s+=c.items.map(function(t){return t.str}).join(' ')+'\n'}
if(s.trim().length<80){$('file').textContent='';msg('No readable text found. It may be a scanned PDF, so please paste the text below.');return}
text=s;$('txt').value='';$('file').textContent='\u2713 '+f.name+' ('+d.numPages+' pages read)';msg('')}
catch(x){msg('Could not read this PDF. Please paste the text below instead.')}};
$('txt').oninput=function(){text=$('txt').value;if(text)$('file').textContent=''};
async function run(k,custom){if(busy)return;var src=($('txt').value||text).trim();
if(src.length<80){msg('Please add a chapter first (PDF or pasted text).');return}
busy=true;msg('Claude is working...');[].forEach.call(document.querySelectorAll('button'),function(b){b.disabled=true});
var task=custom?('Answer this student\'s request about the chapter: '+custom):T[k][2].replace('{M}',$('mk').value);
cur=custom?'Your Answer':T[k][0];
var pr='You are a helpful, accurate teacher for '+$('lvl').value+' students. Use ONLY the chapter text below and do not invent facts. Write in '+$('lang').value+'. Use Markdown (## headings, - bullets, **bold**).\n\nTASK: '+task+'\n\nCHAPTER TEXT:\n'+src.slice(0,60000);
$('res').hidden=false;$('ttl').textContent=cur;$('out').innerHTML='<p>Thinking...</p>';$('res').scrollIntoView({behavior:'smooth'});
try{var rs=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:pr})});var j=await rs.json();if(!rs.ok)throw j;last=j.text;$('out').innerHTML=md(last);msg('')}
catch(e){msg(e&&e.error?e.error:'Something went wrong. Please try again.');if(!last)$('res').hidden=true}
busy=false;[].forEach.call(document.querySelectorAll('button'),function(b){b.disabled=false})}
$('cg').onclick=function(){var q=$('cu').value.trim();if(q)run(null,q)};
$('cu').onkeydown=function(e){if(e.key==='Enter')$('cg').click()};
$('cp').onclick=function(){try{navigator.clipboard.writeText(last);$('cp').textContent='Copied'}catch(e){$('cp').textContent='Select & copy'}setTimeout(function(){$('cp').textContent='Copy'},1500)};
$('dl').onclick=async function(){try{var d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:cur.replace(/\s+/g,'-')+'.md',data:last})}catch(e){msg('Download is not available here. Use Copy instead.')}};
$('pr').onclick=function(){window.print()};
</script></body></html>
